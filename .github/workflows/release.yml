name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (created if missing)
        default: v2.0.1

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish (NativeAOT, win-x64)
        run: dotnet publish OppoPodsManager.csproj -c Release -r win-x64 -o publish

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath OppoPodsManager-win-x64.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: UI fixes
          files: |
            OppoPodsManager-win-x64.zip
            publish/OppoPodsManager.exe
